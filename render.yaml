services:
  - type: web
    name: app-selfstudy
    runtime: docker
    rootDir: app_selfstudy
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_HOST
        value: "0.0.0.0"
      - key: FLASK_PORT
        value: "10000"
      - key: DB_SERVER
        value: "ms1901.gabiadb.com"
      - key: DB_DATABASE
        value: "yujincast"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: "ODBC Driver 18 for SQL Server"
